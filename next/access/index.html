<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Entrar · Peleja</title><link rel="icon" href="../assets/peleja-icon-32.png"><link rel="stylesheet" href="access.css?v=connected-reader-3"></head>
<body>
<header><a class="brand" href="./"><img src="../assets/peleja-icon-192.png" alt=""><strong>peleja</strong></a><button id="theme" aria-label="Alternar tema">◐</button></header>
<main>
<section class="card" aria-labelledby="heading">
<p class="eyebrow">SEU ESPAÇO DE ESTUDO</p><h1 id="heading">Bom te ver por aqui.</h1>
<div id="tabs" class="tabs"><button type="button" data-mode="login" aria-pressed="true">Entrar</button><button type="button" data-mode="signup" aria-pressed="false">Criar conta</button></div>
<form id="form">
<label id="identityLabel" for="identity">Usuário ou e-mail</label><input id="identity" name="username" autocomplete="username" required spellcheck="false" autocapitalize="none">
<div id="passwordGroup"><label for="password">Senha</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="reveal" type="button" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div></div>
<div id="confirmGroup" hidden><label for="confirm">Confirmar senha</label><input id="confirm" type="password" autocomplete="new-password"></div>
<p id="hint" class="hint" hidden></p>
<button id="submit" class="primary" type="submit">Entrar</button>
</form>
<button id="forgot" class="text" data-mode="reset">Esqueci minha senha</button>
<button id="back" class="text" data-mode="login" hidden>Voltar para entrar</button>
<div id="account" hidden><h2 id="accountName"></h2><p id="accountState"></p><dl id="summary"></dl><a class="connected-link" href="../directions/?account=real">Abrir Peleja</a><button id="retry" class="primary">Conferir novamente</button><button id="logout" class="text">Sair</button></div>
<p id="message" role="status" aria-live="polite"></p>
</section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="config.js?v=connected-reader-3"></script><script src="workspace.js?v=connected-reader-3"></script><script src="access.js?v=connected-reader-3"></script>
</body></html>
